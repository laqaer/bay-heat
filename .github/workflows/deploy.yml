name: Deploy to Cloudflare

# Builds the static export (out/) and uploads it to the assets-only Worker in wrangler.jsonc. Static-asset
# requests are free and unlimited on the Workers Free plan; nothing here needs Workers Paid.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the Laqaer Products account)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job builds, then skips the upload with a warning.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate Next.js route types
        run: npx next typegen
      - run: npm run build
      - name: Check credentials
        id: creds
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; built but did not deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes wrangler@4.135.0 deploy --message "${GITHUB_SHA}"
      - name: Summary
        if: steps.creds.outputs.ok == 'true'
        shell: bash
        run: echo "Deployed \`${GITHUB_SHA}\` to the bay-heat Worker (static assets)." >> "$GITHUB_STEP_SUMMARY"
