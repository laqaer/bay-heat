name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # LayoutProps/PageProps are generated helpers in Next.js 16; generate them before tsc in a clean checkout.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Recorded editorial review
        run: npm run check:editorial
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run lint
      - run: npm run typecheck

      # lib/planner, lib/safety, lib/commerce and friends are tested with node's built-in runner (Node 22
      # strips the TypeScript types natively).
      - run: npm test

      - run: npm run build

      # The site ships as a static export to Cloudflare (wrangler.jsonc). Fail here if the export, the generated
      # routing files, or the per-page share cards go missing.
      - name: Check static export
        run: |
          for f in out/index.html out/404.html out/_redirects out/_headers out/sitemap.xml out/robots.txt out/opengraph-image out/og/garage-heater-calculator.png; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q "^/r/:code " out/_redirects
      # The affiliate rules on the exported pages in out/: no dollar figure in a buy plate ([data-buy-group]) with an
      # Amazon link, plus tag, rel, disclosure and manual-warning checks. Then prove the check fails when a copy of a
      # built page gets a dollar figure inside its plate (the negative control drives the same CLI).
      - name: Affiliate rule check
        run: npm run check:affiliates
      - name: Affiliate rule negative control
        run: npm run check:affiliates:control
      # Every product safety line a page shows must list its manual in that page's Sources.
      - name: Source audit
        run: node scripts/source-audit.mjs
      # E2E: serve out/ with wrangler dev and request every sitemap URL over HTTP (status, canonical, disclosure).
      - name: HTTP smoke of every sitemap URL
        run: npm run qa
      - name: Validate Worker config
        run: npx --yes wrangler@4.135.0 deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
