name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # LayoutProps/PageProps are generated helpers in Next.js 16; generate them before tsc in a clean checkout.
      - name: Generate Next.js route types
        run: npx next typegen

      - run: npm run lint
      - run: npm run typecheck

      # lib/planner, lib/safety, lib/commerce and friends are tested with node's built-in runner (Node 22
      # strips the TypeScript types natively).
      - run: npm test

      - run: npm run build
