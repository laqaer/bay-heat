name: Recorded editorial review
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: editorial-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  editorial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted gate from the base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Read candidate content (never execute it)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The installation PR has no gate on its base yet. This is an explicit
      # bootstrap report, not an approval of content; ordinary CI still gates it.
      - name: Report initial policy installation
        if: hashFiles('trusted/scripts/editorial-gate.mjs') == ''
        run: echo "::warning::Trusted policy not yet installed on base. Bootstrap only; no content approval established."
      - name: Verify recorded approvals against exact content
        if: hashFiles('trusted/scripts/editorial-gate.mjs') != ''
        run: node trusted/scripts/editorial-gate.mjs candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
