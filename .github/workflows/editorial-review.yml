name: Recorded editorial review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: editorial-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  editorial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted gate from the base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Read candidate content (never execute it)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recorded approvals against exact content
        run: node trusted/scripts/editorial-gate.mjs candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
